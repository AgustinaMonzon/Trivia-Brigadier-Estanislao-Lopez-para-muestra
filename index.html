<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivia Federal: Brigadier Estanislao López</title>
    <style>
      :root {
        --bg-pergamino: #f4ebd9;
        --card-bg: #fbf6ec;
        --borde-dorado: #b88b4a;
        --texto-oscuro: #2c1e12;
        --celeste-antiguo: #3b6e8c;
        --verde-ok: #2e6f40;
        --rojo-error: #a63a2b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Georgia", "Times New Roman", serif;
      }

      body {
        background-color: var(--bg-pergamino);
        background-image: radial-gradient(#e3d4b7 1px, transparent 1px);
        background-size: 20px 20px;
        color: var(--texto-oscuro);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      .contenedor {
        background: var(--card-bg);
        border: 4px solid var(--borde-dorado);
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(44, 30, 18, 0.2);
        width: 100%;
        max-width: 1100px;
        padding: 24px 32px;
        position: relative;
      }

      /* Encabezado */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--borde-dorado);
        padding-bottom: 12px;
        margin-bottom: 20px;
      }

      .titulo-app {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--celeste-antiguo);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .progreso {
        font-size: 1.4rem;
        font-weight: bold;
        background: var(--borde-dorado);
        color: #fff;
        padding: 6px 18px;
        border-radius: 30px;
      }

      /* Diseño en dos columnas ideal para Tablet Horizontal */
      .contenido-tarjeta {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 28px;
        align-items: center;
      }

      @media (max-width: 820px) {
        .contenido-tarjeta {
          grid-template-columns: 1fr;
        }
      }

      .marco-foto {
        width: 100%;
        height: 320px;
        border: 3px solid var(--borde-dorado);
        border-radius: 14px;
        overflow: hidden;
        background: #e8dcc5;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
      }

      .marco-foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .zona-pregunta {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .pregunta-texto {
        font-size: 2rem;
        font-weight: bold;
        line-height: 1.25;
        color: var(--texto-oscuro);
      }

      .opciones {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .btn-opcion {
        background: #fffdf8;
        border: 3px solid var(--celeste-antiguo);
        border-radius: 14px;
        padding: 16px 20px;
        font-size: 1.35rem;
        font-weight: bold;
        color: var(--texto-oscuro);
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 14px;
        transition:
          transform 0.1s,
          background 0.2s;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .btn-opcion:active {
        transform: scale(0.98);
        background: #e3eff5;
      }

      .letra {
        background: var(--celeste-antiguo);
        color: white;
        min-width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.3rem;
        font-weight: bold;
      }

      /* Modal de Feedback (Acierto / Error) */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(44, 30, 18, 0.75);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 100;
      }

      .overlay.activo {
        display: flex;
      }

      .modal {
        background: var(--card-bg);
        border: 5px solid var(--borde-dorado);
        border-radius: 24px;
        padding: 36px;
        max-width: 600px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .modal h2 {
        font-size: 2.5rem;
        margin-bottom: 14px;
      }

      .modal p {
        font-size: 1.5rem;
        margin-bottom: 28px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .modal.ok h2 {
        color: var(--verde-ok);
      }
      .modal.error h2 {
        color: var(--rojo-error);
      }

      .btn-accion {
        padding: 18px 36px;
        font-size: 1.5rem;
        font-weight: bold;
        border: none;
        border-radius: 14px;
        color: white;
        cursor: pointer;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .btn-siguiente {
        background: var(--verde-ok);
      }
      .btn-reintentar {
        background: var(--rojo-error);
      }

      /* Pantalla Final */
      .pantalla-final {
        display: none;
        text-align: center;
        padding: 40px 20px;
      }

      .pantalla-final h1 {
        font-size: 2.8rem;
        color: var(--celeste-antiguo);
        margin-bottom: 16px;
      }

      .pantalla-final p {
        font-size: 1.6rem;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <!-- Juego Principal -->
      <div id="pantalla-juego">
        <div class="header">
          <div class="titulo-app">Brigadier Estanislao López · 6.º Grado</div>
          <div class="progreso" id="contador">1 / 10</div>
        </div>

        <div class="contenido-tarjeta">
          <div class="marco-foto">
            <img
              id="imagen-tarjeta"
              src="foto1.png"
              alt="Ilustración histórica"
            />
          </div>

          <div class="zona-pregunta">
            <div class="pregunta-texto" id="pregunta">Cargando pregunta...</div>
            <div class="opciones" id="contenedor-opciones"></div>
          </div>
        </div>
      </div>

      <!-- Pantalla Final -->
      <div id="pantalla-final" class="pantalla-final">
        <h1>¡Felicitaciones, Federales!</h1>
        <p>
          Completaron todo el recorrido histórico sobre el Brigadier Estanislao
          López y el federalismo.
        </p>
        <button class="btn-accion btn-siguiente" onclick="reiniciarTrivia()">
          Volver a jugar
        </button>
      </div>
    </div>

    <!-- Cartel de Acierto / Error -->
    <div class="overlay" id="overlay">
      <div class="modal" id="modal-box">
        <h2 id="modal-titulo">¡Muy bien!</h2>
        <p id="modal-mensaje">Respuesta correcta.</p>
        <button class="btn-accion" id="modal-boton">Continuar</button>
      </div>
    </div>

    <script>
      // 10 Preguntas + rutas de tus fotos
      const preguntas = [
        {
          imagen: "foto1.png",
          pregunta: "1. ¿Quién fue el Brigadier Estanislao López?",
          opciones: [
            "Un virrey español que gobernó el Río de la Plata.",
            "Militar y político federal, gobernador de Santa Fe durante gran parte del siglo XIX.",
            "Un explorador que fundó la ciudad de Rosario.",
            "Un presidente de Chile que cruzó la cordillera.",
          ],
          correcta: 1,
        },
        {
          imagen: "foto2.png",
          pregunta: "2. ¿Con qué apodo histórico se lo conoce en Santa Fe?",
          opciones: [
            "El Libertador del Sur.",
            "El Patriarca de la Federación.",
            "El Padre del Aula.",
            "El Gran Almirante.",
          ],
          correcta: 1,
        },
        {
          imagen: "foto3.png",
          pregunta:
            "3. ¿Qué defendía Estanislao López frente al centralismo de Buenos Aires?",
          opciones: [
            "La autonomía de las provincias y el federalismo.",
            "Que todas las leyes se decidieran solo en Europa.",
            "Que Santa Fe dejara de existir como provincia.",
            "Que Buenos Aires cobrara más impuestos sin consultar.",
          ],
          correcta: 0,
        },
        {
          imagen: "foto4.png",
          pregunta: "4. ¿Qué ocurrió en la Batalla de Cepeda de 1820?",
          opciones: [
            "Se firmó la independencia de Estados Unidos.",
            "Las fuerzas federales derrotaron al ejército directorial y cayó el Directorio.",
            "Se inauguró el primer ferrocarril de Santa Fe.",
            "Se jugó el primer partido de fútbol oficial.",
          ],
          correcta: 1,
        },
        {
          imagen: "foto5.png",
          pregunta:
            "5. ¿Qué significa 'autonomía provincial' en este contexto histórico?",
          opciones: [
            "Que cada provincia pudiera organizarse y elegir sus propias autoridades sin un poder central impuesto.",
            "Que las provincias no tuvieran relación comercial entre sí.",
            "Que solo Buenos Aires podía tener ejército.",
            "Que las provincias pasaran a ser países separados para siempre.",
          ],
          correcta: 0,
        },
        {
          imagen: "foto6.png",
          pregunta: "6. ¿En qué año se firmó el Tratado del Cuadrilátero?",
          opciones: ["En 1810.", "En 1816.", "En 1822.", "En 1853."],
          correcta: 2,
        },
        {
          imagen: "foto7.png",
          pregunta: "7. ¿Qué provincias firmaron el Tratado del Cuadrilátero?",
          opciones: [
            "Santa Fe, Buenos Aires, Entre Ríos y Corrientes.",
            "Córdoba, Mendoza, Salta y Jujuy.",
            "Santa Fe, Uruguay, Paraguay y Brasil.",
            "Buenos Aires, La Pampa, Neuquén y Río Negro.",
          ],
          correcta: 0,
        },
        {
          imagen: "foto8.png",
          pregunta:
            "8. ¿Cuál era uno de los objetivos principales del Tratado del Cuadrilátero?",
          opciones: [
            "Promover la paz, la defensa mutua y evitar guerras entre las provincias firmantes.",
            "Prohibir el comercio entre el Litoral y Buenos Aires.",
            "Entregar las provincias a un rey extranjero.",
            "Suspender todas las elecciones provinciales.",
          ],
          correcta: 0,
        },
        {
          imagen: "foto9.png",
          pregunta:
            "9. ¿Cuál es la diferencia entre un 'hecho documentado' y una 'interpretación'?",
          opciones: [
            "No hay diferencia; significan lo mismo.",
            "El hecho es lo registrado/comprobado (fechas, tratados) y la interpretación es cómo se valora o explica.",
            "La interpretación siempre es falsa y el hecho es un cuento.",
            "Los hechos solo aparecen en novelas y las interpretaciones en mapas.",
          ],
          correcta: 1,
        },
        {
          imagen: "foto10.png",
          pregunta:
            "10. ¿Por qué las fuentes históricas pueden mostrar miradas distintas sobre López?",
          opciones: [
            "Porque en la época no existía la escritura.",
            "Porque distintos grupos (aliados federales u opositores porteños) tenían posturas políticas diferentes.",
            "Porque todos los documentos se escribieron mil años después.",
            "Porque nadie opinaba sobre política en el siglo XIX.",
          ],
          correcta: 1,
        },
      ];

      let indiceActual = 0;
      const letras = ["A", "B", "C", "D"];

      // Generador de sonidos integrado
      function tocarSonido(tipo) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (tipo === "ok") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // Do
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12); // Mi
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24); // Sol
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      }

      function cargarPregunta() {
        const actual = preguntas[indiceActual];
        document.getElementById("contador").textContent =
          `${indiceActual + 1} / ${preguntas.length}`;
        document.getElementById("imagen-tarjeta").src = actual.imagen;
        document.getElementById("pregunta").textContent = actual.pregunta;

        const contOpciones = document.getElementById("contenedor-opciones");
        contOpciones.innerHTML = "";

        actual.opciones.forEach((textoOpcion, i) => {
          const btn = document.createElement("button");
          btn.className = "btn-opcion";
          btn.innerHTML = `<span class="letra">${letras[i]}</span> <span>${textoOpcion}</span>`;
          btn.onclick = () => verificarRespuesta(i);
          contOpciones.appendChild(btn);
        });
      }

      function verificarRespuesta(seleccionada) {
        const actual = preguntas[indiceActual];
        const overlay = document.getElementById("overlay");
        const modalBox = document.getElementById("modal-box");
        const titulo = document.getElementById("modal-titulo");
        const mensaje = document.getElementById("modal-mensaje");
        const boton = document.getElementById("modal-boton");

        if (seleccionada === actual.correcta) {
          tocarSonido("ok");
          modalBox.className = "modal ok";
          titulo.textContent = "¡Muy bien, Federal!";
          mensaje.textContent = "¡Respuesta correcta! Gran trabajo en equipo.";
          boton.textContent =
            indiceActual < preguntas.length - 1
              ? "Siguiente pregunta ➔"
              : "Finalizar recorrido";
          boton.className = "btn-accion btn-siguiente";
          boton.onclick = () => {
            overlay.classList.remove("activo");
            indiceActual++;
            if (indiceActual < preguntas.length) {
              cargarPregunta();
            } else {
              document.getElementById("pantalla-juego").style.display = "none";
              document.getElementById("pantalla-final").style.display = "block";
            }
          };
        } else {
          tocarSonido("error");
          modalBox.className = "modal error";
          titulo.textContent = "¡Probá otra vez!";
          mensaje.textContent =
            "No es esa opción. Mirá los carteles de la muestra o pediles una pista a los chicos.";
          boton.textContent = "Volver a intentar";
          boton.className = "btn-accion btn-reintentar";
          boton.onclick = () => {
            overlay.classList.remove("activo");
          };
        }

        overlay.classList.add("activo");
      }

      function reiniciarTrivia() {
        indiceActual = 0;
        document.getElementById("pantalla-final").style.display = "none";
        document.getElementById("pantalla-juego").style.display = "block";
        cargarPregunta();
      }

      cargarPregunta();
    </script>
  </body>
</html>
